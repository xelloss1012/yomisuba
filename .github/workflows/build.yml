name: Build web and Android

on:
  push:
    branches: [main, master]
    # Pushing a tag such as v1.2.0 also publishes a GitHub release with the APK.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publishes the web app and its privacy policy at
  # https://xelloss1012.github.io/yomisuba/ on every push to main.
  pages:
    name: Deploy to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The OAuth client ID is public (it ships inside the web bundle), so it is a
      # repository variable rather than a secret.
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
      # Secrets are not passed to pull requests from forks, which build a debug APK.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the obsolete 'tools' package, which fails.
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build release APK signed with the release key
        if: env.KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          npm run android:build:release
          rm -f "$ANDROID_KEYSTORE_PATH"
      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        run: npm run android:build:debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/android/yomisuba*.apk
          if-no-files-found: error
      - name: Publish the release
        if: github.ref_type == 'tag' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG does not match package.json version $version." >&2
            exit 1
          fi
          gh release create "$TAG" dist/android/yomisuba.apk --title "Yomisuba $version" --generate-notes
